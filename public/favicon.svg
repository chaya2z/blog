<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .paper { fill: #e3e0d7; }
    .shallow { fill: #719da7; }
    .accent { fill: #005a78; }
    .deep { fill: #0f3b49; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #252422; }
      .shallow { fill: #3c97b7; }
      .accent { fill: #78c6e4; }
      .deep { fill: #00698a; }
    }
  </style>
  <clipPath id="tile">
    <rect width="32" height="32" rx="7" />
  </clipPath>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" class="paper" />
    <rect x="6" width="8" height="32" class="shallow" />
    <rect y="18" width="32" height="8" class="shallow" />
    <rect x="6" y="18" width="8" height="8" class="accent" />
    <rect x="22" width="3" height="32" class="accent" />
    <rect y="7" width="32" height="3" class="accent" />
    <rect x="22" y="7" width="3" height="3" class="deep" />
  </g>
</svg>
